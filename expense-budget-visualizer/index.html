<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Simple expense and budget visualizer">
  <title>Expense & Budget Visualizer</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="container">
    <header class="page-header">
      <h1>Expense &amp; Budget Visualizer</h1>
      <button id="themeToggle" class="theme-btn" type="button" aria-label="Switch theme">🌙</button>
    </header>

    <section class="card balance-card" aria-labelledby="balanceTitle">
      <p id="balanceTitle" class="balance-label">TOTAL BALANCE</p>
      <p id="totalBalance" class="balance-amount">$0.00</p>
    </section>

    <section class="card form-card" aria-labelledby="formTitle">
      <h2 id="formTitle">Add Transaction</h2>

      <form id="transactionForm" novalidate>
        <div class="form-group">
          <label for="itemName">Item Name</label>
          <input id="itemName" name="itemName" type="text" placeholder="e.g. Cilok" autocomplete="off" required>
        </div>

        <div class="form-group">
          <label for="amount">Amount</label>
          <input id="amount" name="amount" type="number" min="0.01" step="0.01" placeholder="e.g. 14.94" required>
        </div>

        <div class="form-group">
          <label for="category">Category</label>
          <select id="category" name="category" required>
            <option value="">Choose a category</option>
            <option value="Food">Food</option>
            <option value="Transport">Transport</option>
            <option value="Fun">Fun</option>
          </select>
        </div>

        <p id="formMessage" class="form-message" role="alert" aria-live="polite"></p>
        <button class="primary-btn" type="submit">Add Transaction</button>
      </form>
    </section>

    <section class="stats-grid" aria-label="Expense information">
      <div class="card summary-card">
        <h2>Monthly Summary</h2>
        <div class="summary-items">
          <div>
            <span>Transactions</span>
            <strong id="monthlyCount">0</strong>
          </div>
          <div>
            <span>This Month</span>
            <strong id="monthlyTotal">$0.00</strong>
          </div>
        </div>
      </div>

      <div class="card sort-card">
        <h2>Sort Transactions</h2>
        <label for="sortSelect" class="sr-only">Sort transactions</label>
        <select id="sortSelect">
          <option value="newest">Newest first</option>
          <option value="amountAsc">Amount: Low to High</option>
          <option value="amountDesc">Amount: High to Low</option>
          <option value="category">Category</option>
        </select>
      </div>
    </section>

    <section class="content-grid">
      <section class="card transactions-card" aria-labelledby="transactionsTitle">
        <div class="section-heading">
          <h2 id="transactionsTitle">Transactions</h2>
          <span id="transactionCount" class="count-badge">0</span>
        </div>
        <div id="transactionList" class="transaction-list" aria-live="polite"></div>
      </section>

      <section class="card chart-card" aria-labelledby="chartTitle">
        <h2 id="chartTitle">Spending by Category</h2>
        <div class="chart-wrapper">
          <canvas id="spendingChart" aria-label="Pie chart showing spending by category"></canvas>
        </div>
        <p id="chartEmpty" class="empty-chart">Add transactions to see your spending chart.</p>
      </section>
    </section>

    <footer>
      <p>Expense &amp; Budget Visualizer • Data is saved in your browser.</p>
    </footer>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
